<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Project Management Tool</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* NAVBAR */

        .navbar {
            background: #2563eb;
            color: white;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            background: white;
            color: #2563eb;

            border: none;
            padding: 8px 15px;

            border-radius: 5px;
            cursor: pointer;
        }

        /* MAIN */

        .container {
            padding: 30px;
        }

        /* WELCOME */

        .welcome {
            background: white;
            padding: 25px;

            border-radius: 10px;
            margin-bottom: 25px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* PROJECTS */

        .projects {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        /* BUTTONS */

        .create-btn {
            background: #2563eb;
            color: white;

            border: none;

            padding: 10px 15px;

            border-radius: 5px;

            cursor: pointer;
        }

        .create-btn:hover {
            background: #1d4ed8;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;

            border: none;

            padding: 8px 12px;

            margin-top: 10px;

            border-radius: 5px;

            cursor: pointer;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
            color: white;

            border: none;

            padding: 8px 12px;

            margin-top: 10px;

            border-radius: 5px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            width: 100%;

            padding: 10px;

            margin-top: 8px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            background: #ddd;
        }

        .cancel-btn:hover {
            background: #ccc;
        }

        /* MODAL */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.5);

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .modal-content {
            background: white;

            width: 400px;

            max-width: 90%;

            padding: 25px;

            border-radius: 10px;
        }

        .modal-content input,
        .modal-content textarea,
        .modal-content select {

            width: 100%;

            padding: 10px;

            margin: 8px 0;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-family: Arial, sans-serif;
        }

        /* TASK SECTION */

        .task-section {
            margin-top: 40px;
        }

        /* PROJECT SELECTOR */

        #projectSelect {
            padding: 10px;

            margin-right: 10px;

            margin-bottom: 20px;

            border-radius: 5px;

            border: 1px solid #ccc;

            min-width: 220px;
        }

        /* KANBAN */

        .kanban-board {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 20px;
        }

        .kanban-column {

            background: #e9ecef;

            padding: 15px;

            border-radius: 10px;

            min-height: 300px;
        }

        .kanban-column h3 {

            text-align: center;

            margin-top: 0;
        }

        /* TASK CARD */

        .task-card {

            background: white;

            padding: 15px;

            margin-bottom: 12px;

            border-radius: 8px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .task-card h4 {

            margin-top: 0;

            margin-bottom: 8px;
        }

        .task-card p {

            font-size: 14px;

            color: #555;
        }

        .task-card select {

            width: 100%;

            padding: 7px;

            margin-top: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;
        }

        #taskPriority {
            width: 100%;

            padding: 10px;

            margin: 8px 0;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .kanban-board {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 90%;
            }

            .container {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <nav class="navbar">

        <h2>
            Project Management Tool
        </h2>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>



    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main class="container">


        <!-- WELCOME -->

        <section class="welcome">

            <h1>
                Welcome,
                <span id="userName"></span>
                👋
            </h1>

            <p>
                Manage your projects, tasks and team
                activities from one place.
            </p>

        </section>



        <!-- ========================= -->
        <!-- PROJECTS -->
        <!-- ========================= -->

        <section>

            <h2>
                My Projects
            </h2>

            <div class="projects">

                <div class="card">

                    <h3>
                        No projects yet
                    </h3>

                    <p>
                        Create your first project
                        to get started.
                    </p>

                    <button
                        class="create-btn"
                        onclick="showProjectForm()"
                    >
                        + Create Project
                    </button>

                </div>

            </div>

        </section>



        <!-- ========================= -->
        <!-- TASK MANAGEMENT -->
        <!-- ========================= -->

        <section class="task-section">

            <h2>
                Task Management
            </h2>


            <select id="projectSelect">

                <option value="">
                    Select a project
                </option>

            </select>


            <button
                class="create-btn"
                onclick="showTaskForm()"
            >
                + Create Task
            </button>



            <!-- KANBAN -->

            <div class="kanban-board">


                <!-- TO DO -->

                <div class="kanban-column">

                    <h3>
                        To Do
                    </h3>

                    <div id="todoTasks"></div>

                </div>


                <!-- IN PROGRESS -->

                <div class="kanban-column">

                    <h3>
                        In Progress
                    </h3>

                    <div id="progressTasks"></div>

                </div>


                <!-- DONE -->

                <div class="kanban-column">

                    <h3>
                        Done
                    </h3>

                    <div id="doneTasks"></div>

                </div>


            </div>

        </section>


    </main>



    <!-- ================================= -->
    <!-- CREATE PROJECT MODAL -->
    <!-- ================================= -->

    <div
        id="projectModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>
                Create New Project
            </h2>


            <form id="projectForm">


                <input
                    type="text"
                    id="projectName"
                    placeholder="Project name"
                    required
                >


                <textarea
                    id="projectDescription"
                    placeholder="Project description"
                    rows="4"
                ></textarea>


                <button
                    type="submit"
                    class="create-btn"
                >
                    Create Project
                </button>


                <button
                    type="button"
                    onclick="closeProjectForm()"
                    class="cancel-btn"
                >
                    Cancel
                </button>


            </form>


            <p id="projectMessage"></p>

        </div>

    </div>



    <!-- ================================= -->
    <!-- EDIT PROJECT MODAL -->
    <!-- ================================= -->

    <div
        id="editProjectModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>
                Edit Project
            </h2>


            <form id="editProjectForm">


                <input
                    type="text"
                    id="editProjectName"
                    placeholder="Project name"
                    required
                >


                <textarea
                    id="editProjectDescription"
                    placeholder="Project description"
                    rows="4"
                ></textarea>


                <button
                    type="submit"
                    class="create-btn"
                >
                    Save Changes
                </button>


                <button
                    type="button"
                    onclick="closeEditProjectForm()"
                    class="cancel-btn"
                >
                    Cancel
                </button>


            </form>


            <p id="editProjectMessage"></p>

        </div>

    </div>



    <!-- ================================= -->
    <!-- CREATE TASK MODAL -->
    <!-- ================================= -->

    <div
        id="taskModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>
                Create Task
            </h2>


            <form id="taskForm">


                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Task title"
                    required
                >


                <textarea
                    id="taskDescription"
                    placeholder="Task description"
                    rows="4"
                ></textarea>


                <select id="taskPriority">

                    <option value="low">
                        Low Priority
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Medium Priority
                    </option>

                    <option value="high">
                        High Priority
                    </option>

                </select>


                <button
                    type="submit"
                    class="create-btn"
                >
                    Create Task
                </button>


                <button
                    type="button"
                    onclick="closeTaskForm()"
                    class="cancel-btn"
                >
                    Cancel
                </button>


            </form>


            <p id="taskMessage"></p>

        </div>

    </div>



    <!-- ================================= -->
    <!-- EDIT TASK MODAL -->
    <!-- ================================= -->

    <div
        id="editTaskModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>
                Edit Task
            </h2>


            <form id="editTaskForm">


                <input
                    type="text"
                    id="editTaskTitle"
                    placeholder="Task title"
                    required
                >


                <textarea
                    id="editTaskDescription"
                    placeholder="Task description"
                    rows="4"
                ></textarea>


                <select id="editTaskPriority">

                    <option value="low">
                        Low Priority
                    </option>

                    <option value="medium">
                        Medium Priority
                    </option>

                    <option value="high">
                        High Priority
                    </option>

                </select>


                <button
                    type="submit"
                    class="create-btn"
                >
                    Save Changes
                </button>


                <button
                    type="button"
                    onclick="closeEditTaskForm()"
                    class="cancel-btn"
                >
                    Cancel
                </button>


            </form>


            <p id="editTaskMessage"></p>

        </div>

    </div>



    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="js/dashboard.js"></script>


</body>

</html>
